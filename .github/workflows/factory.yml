name: Factory CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify factory contracts
        run: python3 -m unittest discover -s factory -v
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install pinned Playwright Chromium and system libraries
        run: npx --no-install playwright install --with-deps --no-shell chromium
      - name: Check mobile browser and cold-load budgets
        run: npm run qa --workspace @kelana-ria/web
      - name: Upload mobile QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-chooser-qa
          path: apps/web/qa-results/
          retention-days: 14
