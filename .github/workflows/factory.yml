name: Factory CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify factory contracts
        run: python3 -m unittest discover -s factory -v
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test --workspace @kelana-ria/api
      - name: Rehearse redacted provider capture and outage fallback
        run: npm run capture:integration --workspace @kelana-ria/api
      - name: Install pinned Playwright Chromium and system libraries
        run: npx --no-install playwright install --with-deps --no-shell chromium
      - name: Check mobile browser and cold-load budgets
        run: npm run qa --workspace @kelana-ria/web
      - name: Play through Compact solo Claim
        run: npm run qa:solo --workspace @kelana-ria/web
      - name: Verify Compact Claim across two devices
        run: npm run qa:duo --workspace @kelana-ria/web
      - name: Play both Hide & Seek turns
        run: npm run qa:seek --workspace @kelana-ria/web
      - name: Play rulebook-driven Hide & Seek and Creator Studio
        run: npm run qa:rulebook-seek --workspace @kelana-ria/web
      - name: Play rulebook-driven Claim the City and unified Studio
        run: npm run qa:rulebook-claim --workspace @kelana-ria/web
      - name: Review and publish a versioned creator pack
        run: npm run qa:packs --workspace @kelana-ria/web
      - name: Verify Jakarta-wide and all six release configurations
        run: npm run qa:release --workspace @kelana-ria/web
      - name: Upload mobile QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-web-qa
          path: apps/web/qa-results/
          retention-days: 14
